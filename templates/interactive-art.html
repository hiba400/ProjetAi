{% extends "base.html" %}

{% block title %}Interactive Art - NeuroCanvas{% endblock %}

{% block head %}
<style>
  .canvas-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem;
  }
  canvas {
    border: 2px solid #00ff9d;
    box-shadow: 0 0 15px #00ff9d55;
    background: #0f172a;
    max-width: 100%;
  }
  .controls {
    margin: 1rem;
    display: flex;
    gap: 1rem;
  }
  .controls button {
    padding: 0.5rem 1rem;
    background: #3b82f6;
    color: white;
    border: none;
    border-radius: 0.5rem;
    cursor: pointer;
    transition: background 0.3s;
  }
  .controls button:hover {
    background: #2563eb;
  }
</style>
{% endblock %}

{% block content %}
<div class="canvas-container">
  <h1 class="text-4xl font-bold text-white mb-4">Interactive Art Canvas</h1>
  <p class="text-gray-300 mb-6">Click on the canvas to create colorful shapes</p>
  <canvas id="liveCanvas" width="800" height="600"></canvas>
  <div class="controls">
    <button onclick="clearCanvas()">Clear Canvas</button>
    <button onclick="saveCanvas()">Save Art</button>
  </div>
  <a class="inline-block mt-6 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white px-6 py-3 rounded-full transition"
     href="{{ url_for('gallery') }}">
    Back to Gallery
  </a>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/interactive-art.js') }}"></script>
{% endblock %}
